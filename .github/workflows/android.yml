name: Build Android test APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Build and test both connections
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDev :app:assembleDebug :app:testDevUnitTest :app:testDebugUnitTest :app:lintDev :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-local-dev-test
          path: android/app/build/outputs/apk/dev/app-dev.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Render-test
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
