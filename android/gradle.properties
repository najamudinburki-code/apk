# A laptop with 4 GB of memory thrashes on Gradle's defaults, so the build is sized for it:
# one worker, a capped JVM heap, and no idle daemon holding RAM between runs.
org.gradle.jvmargs=-Xmx1152m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.daemon=false
android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
